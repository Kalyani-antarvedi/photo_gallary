<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>📸 My Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>


    <!-- Category Buttons -->
    <section class="filters">

        <button class="filter-btn active" data-category="all">
            All
        </button>

        <button class="filter-btn" data-category="nature">
            Nature
        </button>

        <button class="filter-btn" data-category="animals">
            Animals
        </button>

        <button class="filter-btn" data-category="travel">
            Travel
        </button>

    </section>


    <!-- Image Gallery -->
    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                 alt="Nature landscape">
            <div class="image-title">Beautiful Nature</div>
        </div>


        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                 alt="Forest">
            <div class="image-title">Green Forest</div>
        </div>


        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80"
                 alt="Dog">
            <div class="image-title">Cute Dog</div>
        </div>


        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=800&q=80"
                 alt="Dog portrait">
            <div class="image-title">Happy Dog</div>
        </div>


        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                 alt="Beach">
            <div class="image-title">Beautiful Beach</div>
        </div>


        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                 alt="Travel destination">
            <div class="image-title">Travel Destination</div>
        </div>

    </main>


    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close-btn" id="closeBtn">
            &times;
        </button>

        <button class="nav-btn prev-btn" id="prevBtn">
            &#10094;
        </button>

        <img id="lightboxImage" src="" alt="Large preview">

        <button class="nav-btn next-btn" id="nextBtn">
            &#10095;
        </button>

    </div>


    <footer>
        <p>© 2026 My Image Gallery</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
